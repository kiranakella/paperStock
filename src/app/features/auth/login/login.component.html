<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>PaperStockIndia Login</mat-card-title>
      <mat-card-subtitle>Paper Trading Platform</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="errorMessage" class="error-message">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onLogin()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input
            matInput
            [(ngModel)]="email"
            name="email"
            type="email"
            placeholder="user@example.com"
            [disabled]="isLoading"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter password"
            [disabled]="isLoading"
          />
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" [disabled]="isLoading">
            <mat-icon>{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="login-button"
          [disabled]="isLoading"
        >
          <span *ngIf="!isLoading">Login</span>
          <mat-spinner *ngIf="isLoading" diameter="20" class="button-spinner"></mat-spinner>
        </button>
      </form>

      <div class="signup-link">
        <span>Don't have an account?</span>
        <a routerLink="/auth/register" [queryParams]="{ returnUrl: returnUrl }">Sign up here</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
